name: Rebuild release assets
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to rebuild
        required: true
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld
      - name: Build and validate
        env:
          HFC_BUILD_JOBS: '2'
          HFC_CLANG: /usr/bin/clang++
          HFC_LLD: /usr/bin/ld.lld
        run: python3 tools/build.py
      - name: Write update.json and changelog
        env:
          TAG: ${{ inputs.tag }}
        run: python3 tools/release_files.py "$TAG"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dist/HyperFont-Control-*.zip dist/HyperFont-Control-*.zip.sha256 dist/build-report.json dist/update.json dist/changelog.md --clobber --repo "$GITHUB_REPOSITORY"
