name: Build module
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  module:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Install native tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld
      - name: Build and validate both architectures
        env:
          HFC_BUILD_JOBS: '2'
          HFC_CLANG: /usr/bin/clang++
          HFC_LLD: /usr/bin/ld.lld
        run: python3 tools/build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HyperFont-Control-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: module
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: HyperFont-Control-${{ github.sha }}
          path: dist
      - name: Generate release metadata and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 tools/release_files.py "$TAG"
          gh release create "$TAG" dist/HyperFont-Control-*.zip dist/HyperFont-Control-*.zip.sha256 dist/build-report.json dist/update.json dist/changelog.md \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "HyperFont Control ${TAG#v}" --notes-file dist/changelog.md --latest
